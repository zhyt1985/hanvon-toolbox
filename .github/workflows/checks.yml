name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-and-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check index and reachable history
        run: |
          python3 scripts/privacy-check.py --staged
          python3 scripts/privacy-check.py --history
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Privacy regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Java policy and capture tests
        run: scripts/test-java.sh
      - name: Generate a synthetic fixture
        run: python3 fixtures/generate.py .build/synthetic-smoke --mib 1
